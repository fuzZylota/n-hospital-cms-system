  <g transform="translate(150,100)">
    <g transform="translate(16,0)"><use href="#d"/></g>
    <g transform="rotate(36 0 0) translate(16,0)"><use href="#d"/></g>
    <g transform="rotate(72 0 0) translate(16,0)"><use href="#d"/></g>
    <g transform="rotate(108 0 0) translate(16,0)"><use href="#d"/></g>
    <g transform="rotate(144 0 0) translate(16,0)"><use href="#d"/></g>
    <g transform="rotate(180 0 0) translate(16,0)"><use href="#d"/></g>
    <g transform="rotate(216 0 0) translate(16,0)"><use href="#d"/></g>
    <g transform="rotate(252 0 0) translate(16,0)"><use href="#d"/></g>
    <g transform="rotate(288 0 0) translate(16,0)"><use href="#d"/></g>
    <g transform="rotate(324 0 0) translate(16,0)"><use href="#d"/></g>
  </g>

  <!-- Solid pupil -->
  <circle cx="150" cy="100" r="13" fill="#071A4A" />
</svg>
