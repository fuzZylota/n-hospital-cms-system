    <g transform="rotate(180 0 0) translate(32,0)"><use href="#d"/></g>
    <g transform="rotate(200 0 0) translate(32,0)"><use href="#d"/></g>
    <g transform="rotate(220 0 0) translate(32,0)"><use href="#d"/></g>
    <g transform="rotate(240 0 0) translate(32,0)"><use href="#d"/></g>
    <g transform="rotate(260 0 0) translate(32,0)"><use href="#d"/></g>
    <g transform="rotate(280 0 0) translate(32,0)"><use href="#d"/></g>
    <g transform="rotate(300 0 0) translate(32,0)"><use href="#d"/></g>
    <g transform="rotate(320 0 0) translate(32,0)"><use href="#d"/></g>
    <g transform="rotate(340 0 0) translate(32,0)"><use href="#d"/></g>
  </g>

  <!-- Ring 3: 14 dots -->
  <g transform="translate(150,100)">
    <g transform="translate(24,0)"><use href="#d"/></g>
    <g transform="rotate(25.714 0 0) translate(24,0)"><use href="#d"/></g>
    <g transform="rotate(51.428 0 0) translate(24,0)"><use href="#d"/></g>
    <g transform="rotate(77.142 0 0) translate(24,0)"><use href="#d"/></g>
    <g transform="rotate(102.856 0 0) translate(24,0)"><use href="#d"/></g>
    <g transform="rotate(128.57 0 0) translate(24,0)"><use href="#d"/></g>
    <g transform="rotate(154.284 0 0) translate(24,0)"><use href="#d"/></g>
    <g transform="rotate(179.998 0 0) translate(24,0)"><use href="#d"/></g>
    <g transform="rotate(205.712 0 0) translate(24,0)"><use href="#d"/></g>
    <g transform="rotate(231.426 0 0) translate(24,0)"><use href="#d"/></g>
    <g transform="rotate(257.14 0 0) translate(24,0)"><use href="#d"/></g>
    <g transform="rotate(282.854 0 0) translate(24,0)"><use href="#d"/></g>
    <g transform="rotate(308.568 0 0) translate(24,0)"><use href="#d"/></g>
