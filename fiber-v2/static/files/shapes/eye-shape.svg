<svg width="360" height="240" viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Replicates the reference using path strokes with round-capped dashed dots -->
  <defs>
    <style>
      .dot { stroke: #071A4A; stroke-width: 12; stroke-linecap: round; fill: none; }
      .dotOuter { stroke: #071A4A; stroke-width: 8; stroke-linecap: round; fill: none; }
    </style>
    <!-- Reusable solid dot -->
    <circle id="d" r="3" fill="#071A4A" />
  </defs>

  <!-- Outer eyelid (ellipse of dots) -->
  <!-- Return to dashed ellipse so dots remain perfect circles -->
  <!-- Outer ellipse dots (perfect circles), edges moved 5px toward center -->
  <g>
    <!-- Right tip (inward by 5px from rx) and left tip -->
    <use href="#d" x="271" y="100" />
    <use href="#d" x="29" y="100" />
    <!-- Upper-right quadrant -->
    <use href="#d" x="263.45" y="110.40" />
    <use href="#d" x="255.97" y="120.33" />
    <use href="#d" x="243.84" y="129.39" />
    <use href="#d" x="227.61" y="137.16" />
    <use href="#d" x="208" y="143.30" />
    <use href="#d" x="185.84" y="147.56" />
    <use href="#d" x="162.12" y="149.73" />
    <use href="#d" x="137.88" y="149.73" />
    <use href="#d" x="114.16" y="147.56" />
    <use href="#d" x="92" y="143.30" />
    <use href="#d" x="72.39" y="137.16" />
    <use href="#d" x="56.16" y="129.39" />
    <use href="#d" x="44.03" y="120.33" />
    <use href="#d" x="36.55" y="110.40" />
    <!-- Lower-right quadrant (symmetric) -->
    <use href="#d" x="263.45" y="89.60" />
    <use href="#d" x="255.97" y="79.67" />
    <use href="#d" x="243.84" y="70.61" />
    <use href="#d" x="227.61" y="62.84" />
    <use href="#d" x="208" y="56.70" />
    <use href="#d" x="185.84" y="52.44" />
    <use href="#d" x="162.12" y="50.27" />
    <use href="#d" x="137.88" y="50.27" />
    <use href="#d" x="114.16" y="52.44" />
    <use href="#d" x="92" y="56.70" />
    <use href="#d" x="72.39" y="62.84" />
    <use href="#d" x="56.16" y="70.61" />
    <use href="#d" x="44.03" y="79.67" />
    <use href="#d" x="36.55" y="89.60" />
  </g>

  <!-- Concentric iris rings (precisely arranged dots) -->
  <!-- Ring 1: 20 dots -->
  <g transform="translate(150,100)">
    <g transform="translate(40,0)"><use href="#d"/></g>
    <g transform="rotate(18 0 0) translate(40,0)"><use href="#d"/></g>
    <g transform="rotate(36 0 0) translate(40,0)"><use href="#d"/></g>
    <g transform="rotate(54 0 0) translate(40,0)"><use href="#d"/></g>
    <g transform="rotate(72 0 0) translate(40,0)"><use href="#d"/></g>
    <g transform="rotate(90 0 0) translate(40,0)"><use href="#d"/></g>
    <g transform="rotate(108 0 0) translate(40,0)"><use href="#d"/></g>
    <g transform="rotate(126 0 0) translate(40,0)"><use href="#d"/></g>
    <g transform="rotate(144 0 0) translate(40,0)"><use href="#d"/></g>
    <g transform="rotate(162 0 0) translate(40,0)"><use href="#d"/></g>
    <g transform="rotate(180 0 0) translate(40,0)"><use href="#d"/></g>
    <g transform="rotate(198 0 0) translate(40,0)"><use href="#d"/></g>
    <g transform="rotate(216 0 0) translate(40,0)"><use href="#d"/></g>
    <g transform="rotate(234 0 0) translate(40,0)"><use href="#d"/></g>
    <g transform="rotate(252 0 0) translate(40,0)"><use href="#d"/></g>
    <g transform="rotate(270 0 0) translate(40,0)"><use href="#d"/></g>
    <g transform="rotate(288 0 0) translate(40,0)"><use href="#d"/></g>
    <g transform="rotate(306 0 0) translate(40,0)"><use href="#d"/></g>
    <g transform="rotate(324 0 0) translate(40,0)"><use href="#d"/></g>
    <g transform="rotate(342 0 0) translate(40,0)"><use href="#d"/></g>
  </g>

  <!-- Ring 2: 18 dots -->
  <g transform="translate(150,100)">
    <g transform="translate(32,0)"><use href="#d"/></g>
    <g transform="rotate(20 0 0) translate(32,0)"><use href="#d"/></g>
    <g transform="rotate(40 0 0) translate(32,0)"><use href="#d"/></g>
    <g transform="rotate(60 0 0) translate(32,0)"><use href="#d"/></g>
    <g transform="rotate(80 0 0) translate(32,0)"><use href="#d"/></g>
    <g transform="rotate(100 0 0) translate(32,0)"><use href="#d"/></g>
